[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cram"
version = "1.0.0"
description = "Spaced repetition TUI for problems and concepts with FSRS scheduling"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "textual>=0.80.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4.0", "mypy>=1.0"]

[project.scripts]
cram = "srs.app:main"

[tool.setuptools.packages.find]
include = ["srs*"]

[tool.setuptools.package-data]
srs = ["*.tcss"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
